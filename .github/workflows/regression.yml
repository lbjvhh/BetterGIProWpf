name: Regression
on:
  push: { branches: [main] }
  pull_request:
  schedule: [{ cron: "0 2 * * 0" }]
  workflow_dispatch:
jobs:
  python-unit:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: nitrogen_bridge } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt pytest pytest-cov
      - run: pytest tests/ -v --cov=. || true
  dotnet-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - run: dotnet build BetterGIProWpf/BetterGIProWpf.csproj -c Release --nologo
  game-regression:
    needs: [python-unit, dotnet-build]
    runs-on: [self-hosted, windows, gpu]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - run: cd nitrogen_bridge; python scripts/run_regression.py --videos test_videos/ --report report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: game-regression, path: nitrogen_bridge/report.json }
